services:
  - type: web
    name: fallfight
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOTS_FILL
        value: "4"
      - key: CORS_ORIGIN
        value: https://caglarsarikaya.github.io
